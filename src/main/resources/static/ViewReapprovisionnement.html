<!DOCTYPE html>
<html>
<head>
    <title>Médicaments à Réapprovisionner</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css" />
</head>
<body>
    <div class="container">
        <h1>📦 Médicaments à Réapprovisionner</h1>
        <p><a href="index.html">← Retour</a></p>
        
        <div id="loading">Chargement...</div>
        <div id="content" style="display:none;">
            <div id="info" style="padding: 15px; background: #fff3cd; border-radius: 4px; margin-bottom: 20px;">
                <strong>ℹ️ Info:</strong> Cette liste montre tous les médicaments dont le stock est inférieur au niveau de réapprovisionnement.
            </div>
            <div id="medicaments"></div>
            <button onclick="envoyerDemandes()" style="margin-top: 20px; padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                📧 Envoyer les demandes de devis
            </button>
            <div id="result" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        fetch('/api/debug/medicaments-a-commander')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                if (data.nombre === 0) {
                    document.getElementById('medicaments').innerHTML = '<p style="color: green;">✅ Aucun médicament à commander pour le moment.</p>';
                } else {
                    const html = `
                        <p><strong>${data.nombre}</strong> médicaments nécessitent un réapprovisionnement</p>
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr>
                                    <th>Médicament</th>
                                    <th>Catégorie</th>
                                    <th>Stock</th>
                                    <th>Seuil</th>
                                    <th>Manque</th>
                                    <th>Fournisseurs</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.medicaments.map(m => `
                                    <tr>
                                        <td><strong>${m.nom}</strong></td>
                                        <td>${m.categorie}</td>
                                        <td style="color: red; font-weight: bold;">${m.stock}</td>
                                        <td>${m.seuil}</td>
                                        <td style="background: #ffebee;">${m.seuil - m.stock}</td>
                                        <td>${m.fournisseurs}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('medicaments').innerHTML = html;
                }
            })
            .catch(error => {
                document.getElementById('loading').innerHTML = `<p style="color: red;">❌ Erreur: ${error.message}</p>`;
            });

        async function envoyerDemandes() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p style="color: blue;">⏳ Envoi en cours...</p>';
            
            try {
                const response = await fetch('/api/reapprovisionnement', { method: 'POST' });
                const text = await response.text();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<p style="color: green; padding: 10px; background: #d4edda; border-radius: 4px;">✅ ${text}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ Erreur: ${text}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">❌ Erreur: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
